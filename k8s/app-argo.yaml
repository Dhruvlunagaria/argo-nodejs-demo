apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-nodejs-demo
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: https://github.com/Dhruvlunagaria/argo-nodejs-demo
    targetRevision: HEAD
    path: k8s
  project: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
